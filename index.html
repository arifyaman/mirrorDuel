<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCanvas Hello World</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="module">
import {
  Application,
  Color,
  Entity,
  FILLMODE_FILL_WINDOW,
  RESOLUTION_AUTO,
  StandardMaterial,
  Vec3
} from 'playcanvas';
import { Player } from './src/player.js';

const canvas = document.createElement('canvas');
canvas.addEventListener('webglcontextlost', (e) => e.preventDefault());
document.body.appendChild(canvas);

const app = new Application(canvas, {
  graphicsDeviceOptions: {
    antialias: true
  }
});

app.setCanvasFillMode(FILLMODE_FILL_WINDOW);
app.setCanvasResolution(RESOLUTION_AUTO);

window.addEventListener('resize', () => app.resizeCanvas());

app.automaticallyManageScenes = false;

const floor = new Entity('floor');
const floorRender = floor.addComponent('render', { type: 'box' });
floor.setLocalScale(10, 0.1, 10);
floor.setPosition(0, -0.5, 0);

const floorMaterial = new StandardMaterial();
floorMaterial.diffuse = new Color(0.3, 0.3, 0.3);
floorMaterial.update();
floorRender.material = floorMaterial;

app.root.addChild(floor);

const camera = new Entity('camera');
const cameraComponent = camera.addComponent('camera', {
  clearColor: new Color(0.1, 0.2, 0.3)
});
app.root.addChild(camera);
camera.setPosition(0, 10, 10);
camera.lookAt(new Vec3(0, 0, 0));

const player = new Player(app, canvas, cameraComponent);

const sunLight = new Entity('sun');
const sunComponent = sunLight.addComponent('light', {
  type: 'directional',
  intensity: 9
});
app.root.addChild(sunLight);
sunLight.setEulerAngles(40, 30, 0);
sunLight.setPosition(-15, 40, -15);

const lightColor = new Color(1, 1, 1);
const light = new Entity();
light.addComponent('light', {
    type: 'directional',
    color: lightColor,
    intensity: 1,
    range: 700,
    shadowResolution: 4096,
    shadowDistance: 600,
    castShadows: true,
    shadowBias: 0.2,
    normalOffsetBias: 0.05
});
app.root.addChild(light);

app.on('update', dt => {
  player.update(dt);
});

app.start();
    </script>
</body>
</html>
