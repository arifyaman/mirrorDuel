<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crescent Slash VFX — Three.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; height: 100%; }
  #app-canvas { width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font-family: 'Segoe UI', Arial, sans-serif; color: #cfe8ff;
    background: rgba(10, 14, 20, 0.55); border: 1px solid rgba(120, 200, 255, 0.25);
    padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.6;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #7fe3ff; }
  #status {
    position: fixed; bottom: 14px; left: 14px; z-index: 10;
    font-family: monospace; color: #ff8080; font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="app-canvas"></canvas>
<div id="hud">
  <div>Click the ground — crescent slash toward the click point</div>
  <div><b>Space</b> — slash in a default direction</div>
</div>
<div id="status"></div>

<script>
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('failed: ' + src));
    document.head.appendChild(s);
  });
}

const CDN_SOURCES = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
  'https://unpkg.com/three@0.160.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js'
];

async function loadEngine() {
  for (const src of CDN_SOURCES) {
    try {
      await loadScript(src);
      if (typeof THREE !== 'undefined') return true;
    } catch (e) { /* try next source */ }
  }
  return false;
}

loadEngine().then((ok) => {
  if (ok) {
    startApp();
  } else {
    document.getElementById('status').textContent =
      'Could not load Three.js from any CDN. Check network settings.';
  }
});

function startApp() {
  const canvas = document.getElementById('app-canvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e14);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 7.5, 6.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // lighting + ground, just for context
  scene.add(new THREE.AmbientLight(0x2a2f3a, 1.2));
  const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.1);
  dirLight.position.set(3, 6, 4);
  scene.add(dirLight);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(18, 18),
    new THREE.MeshStandardMaterial({ color: 0x14171f, roughness: 0.9, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const pivotMarker = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x5fd0ff })
  );
  pivotMarker.position.set(0, 0.15, 0);
  scene.add(pivotMarker);

  // -----------------------------------------------------------------
  // CRESCENT GEOMETRY — tapered ring-segment, thin at both tips, wide
  // at center, lying flat on XZ. theta=0 points toward -Z (forward).
  // -----------------------------------------------------------------
  function createCrescentGeometry(opts) {
    const {
      arcAngle = 110 * (Math.PI / 180),
      outerRadius = 1.3,
      thickness = 0.55,
      segments = 40,
      taperPower = 1.3
    } = opts;

    const positions = [];
    const uvs = [];
    const indices = [];

    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const theta = -arcAngle / 2 + t * arcAngle;
      const taper = Math.pow(Math.sin(t * Math.PI), taperPower);
      const rOuter = outerRadius;
      const rInner = outerRadius - thickness * taper;

      const sinT = Math.sin(theta), cosT = Math.cos(theta);

      positions.push(sinT * rOuter, 0, -cosT * rOuter);
      uvs.push(t, 1);

      positions.push(sinT * rInner, 0, -cosT * rInner);
      uvs.push(t, 0);
    }

    for (let i = 0; i < segments; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, b, c, b, d, c);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    return geo;
  }

  // -----------------------------------------------------------------
  // SHADER — additive glow, core-to-edge gradient, rim brighten, a
  // scrolling energy streak, sweep-reveal + fade driven from JS.
  // -----------------------------------------------------------------
  const vertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const fragmentShader = `
    precision mediump float;
    varying vec2 vUv;
    uniform float uTime;
    uniform float uAlpha;
    uniform float uSweep;
    uniform vec3 uColorCore;
    uniform vec3 uColorEdge;

    void main() {
      float u = vUv.x;
      float v = vUv.y;

      float sweepEdge = 0.10;
      float reveal = smoothstep(u + sweepEdge, u - sweepEdge, uSweep);
      float endFade = smoothstep(0.0, 0.05, u) * smoothstep(1.0, 0.95, u);

      vec3 col = mix(uColorEdge, uColorCore, pow(v, 1.6));

      float rim = pow(v, 4.0) * 1.4;
      col += rim * uColorCore;

      float streak = sin(u * 40.0 - uTime * 9.0) * 0.5 + 0.5;
      streak = pow(streak, 6.0);
      col += streak * 0.35 * uColorCore;

      float alpha = reveal * endFade * uAlpha;
      alpha *= smoothstep(0.0, 0.25, v);

      gl_FragColor = vec4(col, alpha);
    }
  `;

  function createCrescentMaterial() {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uAlpha: { value: 1 },
        uSweep: { value: 0 },
        uColorCore: { value: new THREE.Color(0x73e6ff) },
        uColorEdge: { value: new THREE.Color(0x0d3378) }
      },
      vertexShader,
      fragmentShader,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
  }

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  const activeSlashes = [];

  // -----------------------------------------------------------------
  // PUBLIC API — call this from your ability system to spawn one slash.
  // -----------------------------------------------------------------
  function spawnCrescentSlash(options = {}) {
    const {
      position = new THREE.Vector3(0, 0.05, 0),
      facingAngle = 0,        // radians, yaw
      coreColor = 0x73e6ff,
      edgeColor = 0x0d3378,
      radius = 1.3,
      arcAngle = 110,
      duration = 0.35
    } = options;

    const geo = createCrescentGeometry({
      outerRadius: radius,
      arcAngle: arcAngle * (Math.PI / 180)
    });
    const mat = createCrescentMaterial();
    mat.uniforms.uColorCore.value.set(coreColor);
    mat.uniforms.uColorEdge.value.set(edgeColor);

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(position);
    mesh.rotation.y = facingAngle;
    mesh.scale.set(0.5, 1, 0.5);
    scene.add(mesh);

    activeSlashes.push({
      mesh, mat,
      elapsed: 0,
      duration,
      sweepDuration: duration * 0.45,
      holdDuration: duration * 0.15,
      fadeDuration: duration * 0.40
    });
  }

  function updateSlashes(dt) {
    for (let i = activeSlashes.length - 1; i >= 0; i--) {
      const s = activeSlashes[i];
      s.elapsed += dt;
      s.mat.uniforms.uTime.value = s.elapsed;

      const scaleT = Math.min(s.elapsed / 0.09, 1);
      const scale = THREE.MathUtils.lerp(0.5, 1, easeOutBack(scaleT));
      s.mesh.scale.set(scale, 1, scale);

      let sweep = s.elapsed < s.sweepDuration ? s.elapsed / s.sweepDuration : 1;
      let alpha = 1;
      if (s.elapsed > s.sweepDuration + s.holdDuration) {
        const fadeT = (s.elapsed - s.sweepDuration - s.holdDuration) / s.fadeDuration;
        alpha = 1 - Math.min(fadeT, 1);
      }
      s.mat.uniforms.uSweep.value = sweep;
      s.mat.uniforms.uAlpha.value = alpha;

      if (s.elapsed >= s.duration) {
        scene.remove(s.mesh);
        s.mesh.geometry.dispose();
        s.mat.dispose();
        activeSlashes.splice(i, 1);
      }
    }
  }

  // -----------------------------------------------------------------
  // DEMO INTERACTION — click ground to slash toward the click point,
  // Space to slash in a default direction. No movement/rotation logic.
  // -----------------------------------------------------------------
  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  const origin = new THREE.Vector3(0, 0, 0);

  function attackToward(point) {
    const dir = point.clone().sub(origin);
    dir.y = 0;
    if (dir.lengthSq() < 0.0001) return;
    dir.normalize();

    const yaw = Math.atan2(-dir.x, -dir.z);
    const spawnPos = origin.clone().add(dir.clone().multiplyScalar(1.1));
    spawnPos.y = 0.05;

    spawnCrescentSlash({
      position: spawnPos,
      facingAngle: yaw,
      coreColor: 0x73e6ff,
      edgeColor: 0x0d3378,
      radius: 1.2,
      arcAngle: 115,
      duration: 0.35
    });
  }

  renderer.domElement.addEventListener('pointerdown', (e) => {
    pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const hit = raycaster.intersectObject(ground)[0];
    if (hit) attackToward(hit.point);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      attackToward(new THREE.Vector3(0, 0, -2));
    }
  });

  // expose for integration/testing from the console
  window.spawnCrescentSlash = spawnCrescentSlash;

  // -----------------------------------------------------------------
  // RENDER LOOP
  // -----------------------------------------------------------------
  let lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    updateSlashes(dt);

    // gentle cosmetic auto-orbit, purely for showcase
    const t = now * 0.00006;
    camera.position.x = Math.sin(t) * 7.5;
    camera.position.z = Math.cos(t) * 7.5 + 1;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
