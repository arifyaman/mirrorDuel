<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Duel</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            z-index: 200;
            text-align: center;
        }
        #ping {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            z-index: 200;
            text-align: right;
        }
        #cooldown-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 100;
        }
        #cooldown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            line-height: 1;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "playcanvas": "./node_modules/playcanvas/build/playcanvas.mjs"
  }
}
</script>
</head>
<body>
    <div id="status">Disconnected</div>
    <div id="ping">--</div>
    <script type="module">
import { Game } from './src/game.js';
const game = new Game();
game.start();
    </script>
</body>
</html>
